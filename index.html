<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="儿童英语句子点读跟读工具：输入或上传英文，自动按句子分段，点句子朗读、点单词查释义听发音。">
<title>英语点读小助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF8A5C'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EEN%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F6F8F3;
    --paper:#FFFFFF;
    --ink:#2E3A46;
    --ink-soft:#5B6B7A;
    --line:#E4E9DF;
    --coral:#FF8A5C;
    --coral-deep:#F26B3A;
    --mint:#3FB98C;
    --sky:#5FA8F5;
    --sun:#FFC93C;
    --lav:#A78BFA;
    --danger:#E25B5B;
    --radius:22px;
    --shadow:0 6px 24px rgba(46,58,70,.08);
    --tap:rgba(63,185,140,.16);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --fs:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    font-family:-apple-system,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:var(--fs);line-height:1.6;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    min-height:100%;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
  input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .hidden{display:none!important}

  /* ===== 顶栏 ===== */
  header{
    position:sticky;top:0;z-index:20;
    padding:calc(10px + var(--safe-top)) 16px 10px;
    background:rgba(246,248,243,.92);
    backdrop-filter:saturate(1.2) blur(10px);
    -webkit-backdrop-filter:saturate(1.2) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;margin-right:auto}
  .logo-mark{
    width:42px;height:42px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--coral),var(--sun));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(255,138,92,.35);
  }
  .logo h1{font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo .sub{font-size:12px;color:var(--ink-soft);font-weight:500;line-height:1.3}
  .ver-badge{
    display:inline-block;vertical-align:2px;margin-left:6px;
    font-size:10px;font-weight:800;color:#fff;background:var(--mint);
    border-radius:8px;padding:2px 7px;letter-spacing:.5px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--paper);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:14px;font-weight:600;
    box-shadow:0 2px 8px rgba(46,58,70,.06);
    transition:transform .12s ease, background .2s;
  }
  .chip:active{transform:scale(.94)}
  .chip.on{background:var(--mint);border-color:var(--mint);color:#fff}
  .chip svg{width:16px;height:16px;flex:0 0 auto}
  .chip-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip-group + .chip-group{margin-left:14px}
  .chip-group .lbl{font-size:12px;color:var(--ink-soft);align-self:center;font-weight:600}
  /* 手机：紧凑 */
  @media (max-width:479px){
    .bar{gap:8px}
    .chip{padding:7px 11px;font-size:13px}
    .chip-group{gap:6px}
    .chip-group + .chip-group{margin-left:6px}
  }
  /* iPad/小平板竖屏：放宽间距、加大触控目标 */
  @media (min-width:480px) and (max-width:859px){
    .bar{gap:12px}
    .chip{padding:11px 18px;font-size:15px}
    .chip-group{gap:10px}
    .chip-group + .chip-group{margin-left:10px}
    .logo h1{font-size:22px}
    .logo-mark{width:46px;height:46px}
    .jump-wrap{padding:4px 6px 4px 14px}
    #jumpInput{width:64px;font-size:16px}
    #btnJump{padding:7px 15px}
  }
  /* 桌面/横屏平板：顶栏一行宽松 */
  @media (min-width:860px){
    .bar{gap:14px}
    .chip-group{gap:9px}
  }
.engine-row{display:flex;gap:10px;margin-bottom:10px}
.engine-btn{
  flex:1;padding:12px 8px;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);font-size:15px;font-weight:700;color:var(--ink);
  transition:transform .12s ease;
}
.engine-btn.on{border-color:var(--coral);background:var(--coral);color:#fff}
.engine-btn:active{transform:scale(.95)}
.engine-hint{font-size:12px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5}
.kid-row{margin-bottom:12px}
.kid-btn{
  width:100%;padding:10px;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);font-size:14px;font-weight:700;color:var(--ink);
  transition:transform .12s ease;
}
.kid-btn.on{border-color:var(--sky);background:var(--sky);color:#fff}
.kid-btn:active{transform:scale(.97)}
  .jump-wrap{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--paper);border:1px solid var(--line);border-radius:999px;
    padding:3px 5px 3px 12px;box-shadow:0 2px 8px rgba(46,58,70,.06);
  }
  #jumpInput{
    width:58px;border:none;outline:none;background:transparent;
    font-size:15px;font-weight:700;color:var(--ink);
    -moz-appearance:textfield;appearance:textfield;
  }
  #jumpInput::-webkit-outer-spin-button,#jumpInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #btnJump{
    border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700;
    background:var(--sky);color:#fff;flex:0 0 auto;
  }
  #btnJump:active{transform:scale(.92)}
  #btnClear.chip{color:var(--danger)}

  /* ===== 主体布局 ===== */
  main{max-width:980px;margin:0 auto;padding:16px 16px calc(40px + var(--safe-bottom))}
  @media (min-width:860px){
    main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
    main.learn{display:block}
  }

  /* ===== 输入面板 ===== */
  .panel{
    background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  }
  .panel h2{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h2 svg{width:18px;height:18px;color:var(--coral)}
  textarea{
    width:100%;min-height:170px;resize:vertical;
    border:2px solid var(--line);border-radius:16px;
    padding:14px;font-size:17px;line-height:1.7;
    background:var(--bg);outline:none;transition:border-color .2s;
  }
  textarea:focus{border-color:var(--sky)}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:16px;padding:13px 18px;font-size:16px;font-weight:700;
    transition:transform .12s ease,box-shadow .2s;
  }
  .btn:active{transform:scale(.95)}
  .btn svg{width:18px;height:18px;flex:0 0 auto}
  .btn-primary{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,138,92,.35);flex:1}
  .btn-ghost{background:var(--bg);border:1.5px solid var(--line);color:var(--ink)}
  .btn-ghost.green:active{background:var(--tap)}
  .file-label{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:16px;padding:13px 18px;font-size:16px;font-weight:700;
    background:var(--sky);color:#fff;box-shadow:0 6px 16px rgba(95,168,245,.3);
    cursor:pointer;transition:transform .12s ease;
  }
  .file-label:active{transform:scale(.95)}
  #fileInput{display:none}
  .hint{margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.6}
  .example{color:var(--sky);font-weight:600;text-decoration:underline;text-underline-offset:3px}

  /* ===== 学习区 ===== */
  #readPanel{display:flex;flex-direction:column;gap:12px;min-width:0}
  .read-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .read-head .stat{font-size:13px;color:var(--ink-soft);font-weight:600}
  .read-head .spacer{flex:1}
  #btnPlayAll.chip.on{background:var(--sky);border-color:var(--sky)}
  #readList{display:flex;flex-direction:column;gap:10px;margin-top:2px}

  .sent{
    position:relative;
    background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
    padding:16px 62px 16px 18px;font-size:var(--fs);line-height:2;font-weight:600;
    box-shadow:0 4px 14px rgba(46,58,70,.05);
    transition:border-color .2s, background .2s, transform .1s;
    cursor:pointer;
    overflow-wrap:break-word;
  }
  .sent:active{transform:scale(.985)}
  .sent.playing{background:#FFF6EE;border-color:var(--coral)}
  .sent .w{
    border-radius:8px;padding:1px 2px;margin:-1px 0;
    transition:background .15s, color .15s;
    cursor:pointer;
  }
  .sent .w.hl{background:var(--sun);color:#4A3800}
  .sent .w.tapped{background:var(--coral);color:#fff}
  .sent .snum{
    position:absolute;left:-9px;top:-9px;
    width:26px;height:26px;border-radius:50%;
    background:var(--mint);color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(63,185,140,.4);
  }
.side-btns{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    pointer-events:none;
  }
  .speak-ico{
    width:38px;height:38px;border-radius:50%;
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    color:var(--coral);border:1.5px solid var(--line);pointer-events:none;
  }
  .tr-btn{
    pointer-events:auto;
    width:38px;height:24px;border-radius:12px;border:none;cursor:pointer;
    background:var(--mint);color:#fff;font-size:13px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 5px rgba(63,185,140,.35);
    transition:transform .1s;
  }
  .tr-btn:active{transform:scale(.92)}
  .tr-box{
    margin:12px 54px 2px 0;padding:10px 12px;border-radius:10px;
    background:#EFFAF5;border:1.5px solid #BCE7D6;color:#0F5132;
    font-size:14px;font-weight:700;line-height:1.7;
  }
  .sent.playing .speak-ico{background:var(--coral);color:#fff;border-color:var(--coral)}
  .sent.playing .speak-ico svg{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  @media (prefers-reduced-motion: reduce){
    .sent.playing .speak-ico svg{animation:none}
  }

  .empty{
    background:var(--paper);border:2px dashed var(--line);border-radius:var(--radius);
    padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:15px;font-weight:600;
    line-height:2;
  }

  /* ===== 单词抽屉 ===== */
  .mask{
    position:fixed;inset:0;background:rgba(46,58,70,.35);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
  }
  .mask.show{opacity:1;pointer-events:auto}
  #wordSheet,#voiceSheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--paper);border-radius:26px 26px 0 0;
    box-shadow:0 -8px 40px rgba(46,58,70,.18);
    transform:translateY(105%);transition:transform .3s cubic-bezier(.22,.9,.35,1);
    max-height:74vh;min-height:52vh;display:flex;flex-direction:column;
    padding-bottom:var(--safe-bottom);
  }
  #wordSheet.show,#voiceSheet.show{transform:translateY(0)}
  .sheet-inner{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 22px 28px}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
  .w-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .w-word{font-size:30px;font-weight:800;letter-spacing:.3px}
  .w-ph{font-size:16px;color:var(--ink-soft);font-weight:600}
  .w-play{
    width:44px;height:44px;border-radius:50%;flex:0 0 auto;
    background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(255,138,92,.4);margin-left:auto;
  }
  .w-play:active{transform:scale(.9)}
  .w-loading{font-size:14px;color:var(--ink-soft);padding:14px 0}
  .w-def{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .def-block{background:var(--bg);border-radius:14px;padding:12px 14px}
  .def-pos{font-size:12px;font-weight:800;color:var(--sky);text-transform:uppercase;letter-spacing:.6px}
  .def-zh{font-size:17px;font-weight:700;margin-top:2px}
  .def-en{font-size:15px;color:var(--ink-soft);font-weight:500;margin-top:4px}
  .def-ex{font-size:15px;font-style:italic;color:var(--ink);margin-top:8px;border-left:3px solid var(--sun);padding-left:10px}
  .offline-note{font-size:13px;color:var(--danger);margin-top:10px;font-weight:600}
  .w-close{
    display:block;width:100%;margin-top:16px;padding:13px;
    border-radius:16px;background:var(--bg);font-weight:700;color:var(--ink-soft);
  }
  .w-close:active{background:var(--line)}
  .sheet-title{font-size:18px;font-weight:800;margin-bottom:12px}
  .sheet-tip{font-size:13px;color:var(--ink-soft);line-height:1.7;background:#FFF6EE;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .voice-item{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 14px;border-radius:14px;background:var(--bg);
    margin-bottom:8px;text-align:left;border:2px solid transparent;
    transition:border-color .2s,background .2s;
  }
  .voice-item:active{transform:scale(.985)}
  .voice-item.on{border-color:var(--mint);background:#EFF9F4}
  .voice-item .vn{font-weight:700;font-size:16px}
  .voice-item .vl{font-size:12px;color:var(--ink-soft)}
  .voice-item .mark{margin-left:auto;color:var(--mint);font-size:18px;font-weight:800}

  /* ===== 提示 ===== */
  #toast{
    position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:14px;font-weight:600;
    padding:11px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:859px){
    header{padding-top:calc(8px + var(--safe-top))}
    .logo h1{font-size:17px}
    .logo .sub{display:none}
  }
.online-note{
  display:none;margin:10px 0;padding:10px 12px;border-radius:12px;
  background:#fff7ed;border:2px solid #fed7aa;color:#9a3412;
  font-size:13px;line-height:1.5;
}
.online-note.show{display:block}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-3"/><path d="M4 12h9"/><path d="M8.5 9.5 12 13l-3.5 3.5"/></svg>
      </div>
      <div><h1>英语点读小助手<span class="ver-badge">v10</span></h1><div class="sub">点句子朗读 · 点单词学释义</div></div>
    </div>
    <div class="chip-group">
      <span class="lbl">语速</span>
      <button class="chip" id="btnSpeed" title="切换语速">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="speedLbl">0.8x</span>
      </button>
      <button class="chip" id="btnVoice" title="选择朗读音色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
        <span id="voiceLbl">自动</span>
      </button>
      <button class="chip" id="btnFont" title="切换字号">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20 10 4h4l6 16"/><path d="M7 14h10"/></svg>
        <span id="fontLbl">标准</span>
      </button>
    </div>
    <div class="chip-group">
      <button class="chip" id="btnPlayAll" title="连续朗读所有句子">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
        连读
      </button>
      <span class="jump-wrap" title="输入句号，跳到那一句">
        <input id="jumpInput" type="number" inputmode="numeric" min="1" placeholder="句号">
        <button id="btnJump">跳</button>
      </span>
      <button class="chip" id="btnClear" title="清空并回到输入页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
        清空
      </button>
    </div>
  </div>
</header>

<main>
  <!-- ===== 输入面板 ===== -->
  <section class="panel" id="inputPanel">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      输入英文
    </h2>
    <textarea id="textInput" placeholder="在这里粘贴或输入英文，例如：&#10;The cat is sleeping. It is very cute!&#10;&#10;也可以点下方按钮上传 .txt 文件"></textarea>
    <div class="row">
      <label class="file-label" for="fileInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        上传 txt
      </label>
      <input type="file" id="fileInput" accept=".txt,text/plain">
      <button class="btn btn-primary" id="btnStart">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
        开始学习
      </button>
    </div>
    <p class="hint">没有英文？试试 <span class="example" id="btnSample">一段示例短文</span>。</p>
    <p class="hint">提示：句子会按 . ! ? 自动分段；点句子听朗读，点单词看释义和发音。</p>
  </section>

  <!-- ===== 学习区 ===== -->
  <section id="readPanel" class="hidden">
    <div class="read-head">
      <span class="stat" id="statInfo">共 0 句</span>
      <div class="spacer"></div>
      <button class="chip" id="btnBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回修改
      </button>
    </div>
    <div id="readList"></div>
  </section>
</main>

<!-- ===== 单词抽屉 ===== -->
<div class="mask" id="mask"></div>
<div id="wordSheet" role="dialog" aria-modal="true" aria-label="单词释义">
  <div class="grab"></div>
  <div class="sheet-inner" id="sheetInner"></div>
</div>

<div id="voiceSheet" role="dialog" aria-modal="true" aria-label="选择音色">
  <div class="grab"></div>
  <div class="sheet-inner">
    <div class="sheet-title">选择朗读音色</div>
    <div class="engine-row" id="engineRow">
      <button class="engine-btn" data-engine="system">系统语音</button>

    <div class="kid-row">

    </div>
    <div id="onlineNote" class="online-note">真人语音：正在使用<b>百度在线真人音色</b>（整句连贯、国内免费、需联网）。下方系统语音列表无需选择；网络不通时自动回退系统音色。</div>
    <div id="voiceList"></div>
    <p class="sheet-tip">提示：iPad 可免费下载更多英语语音：「设置 → 辅助功能 → 朗读内容 → 声音 → 英语」里下载后，回来就能看到新音色。（版本 v9）</p>

<!-- ===== 核心逻辑 ===== -->
<script>
"use strict";
/* ========== 状态 ========== */
const S = {
  text:"",
  sents:[],
  speed:0.8,
  fsIdx:1,
  playing:-1,
  playAll:false,
  wordTimer:null,
  curWord:"",
  voiceName:"",
  engine:"system",
  trCache:{},
  curAudio:null,
  kid:false,
  edgeCancel:false
};
try{let _e=localStorage.getItem("er_engine");if(_e==="baidu"||_e==="google")_e="edge";S.engine=_e||"system";}catch(e){}
try{S.kid=localStorage.getItem("er_kid")==="1";}catch(e){}

const SPEEDS=[0.6,0.8,1.0,1.2];
const FONTS=[18,21,25,29];
const FONT_LBL=["小","标准","大","特大"];
const $=id=>document.getElementById(id);

/* ========== 语音初始化（iOS 兼容） ========== */
let voices=[];
function loadVoices(){
  voices=speechSynthesis.getVoices();
}
loadVoices();
if(typeof speechSynthesis!=="undefined"){
  speechSynthesis.onvoiceschanged=function(){loadVoices();renderVoices();};
  document.addEventListener("touchstart",function unlock(){speechSynthesis.cancel();document.removeEventListener("touchstart",unlock);},{once:true,passive:true});
}
function pickVoice(){
  if(S.voiceName){
    const f=voices.find(v=>v.name===S.voiceName);
    if(f)return f;
  }
  /* 谷歌音色引擎：优先使用系统自带的 Google 语音（Chrome/Edge/Android 自带，无需联网） */
  if(S.engine==="google"){
    const g=voices.filter(v=>/^Google/i.test(v.name));
    if(g.length)return g[0];
  }
  const en=voices.filter(v=>/^en/i.test(v.lang));
  if(!en.length)return null;
  const pref=["Samantha","Alex","Daniel","Karen","Moira","Fiona","Google US English","Microsoft Zira","Microsoft Aria","Microsoft Guy","Microsoft David","Microsoft Jenny"];
  for(const p of pref){const f=en.find(v=>v.name===p);if(f)return f;}
  return en.find(v=>/en-US/i.test(v.lang))||en[0];
}
function speak(text,onEnd,onBoundary){
  if(typeof speechSynthesis==="undefined"){toast("当前设备不支持朗读");return;}
  /* 不在这里 cancel：整句/连读顺序由队列保证，打断统一由 stopAll() 负责 */
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  const v=pickVoice();if(v)u.voice=v;
  u.rate=S.speed;
  u.pitch=S.kid?1.35:1; /* 童声模式：音调提高，更像小朋友 */
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent||"");
  const kick=isIOS?setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(kick);}else{speechSynthesis.resume();}},6500):null;
  let ended=false;
  const doneOnce=()=>{if(ended)return;ended=true;if(onEnd)onEnd();};
  u.onend=function(){if(kick)clearInterval(kick);doneOnce();};
  u.onerror=function(){doneOnce();};
  /* 桌面 Chrome 支持 boundary 逐词事件；iOS 不触发，退化为整句高亮 */
  if(onBoundary)u.onboundary=function(e){onBoundary(e.charIndex||0);};
  speechSynthesis.speak(u);
}

function playBaidu(text,onEnd){
  /* 百度在线真人音色（gettts：国内免费、稳定、无需 key、整句连贯不变调）。
     失败重试一次，再回退谷歌在线，最后回退系统语音 */
  if(text.length>180){playGoogle(text,onEnd);return;}
  let ended=false,attempt=0;
  const doneOnce=()=>{if(ended)return;ended=true;if(onEnd)onEnd();};
  const fallback=()=>{if(ended)return;ended=true;playGoogle(text,onEnd);};
  const start=()=>{
    if(ended)return;
    attempt++;
    try{
      /* spd 越小越慢：0.8 倍速(默认)用 2 档慢读，正常用 3 */
      const spd=S.speed<=0.8?2:(S.speed<=1.1?3:4);
      const url="https://fanyi.baidu.com/gettts?lan=en&text="+encodeURIComponent(text)+"&spd="+spd+"&source=web";
      const a=new Audio(url);
      a.referrerPolicy="no-referrer";
      a.preload="auto";
      S.curAudio=a;
      a.onended=doneOnce;
      a.onerror=function(){
        if(attempt<2){setTimeout(function(){if(!ended)start();},500);}
        else{fallback();}
      };
      const pr=a.play();
      if(pr&&pr.catch)pr.catch(function(){
        if(attempt<2){setTimeout(function(){if(!ended)start();},500);}
        else{fallback();}
      });
    }catch(e){if(attempt<2){setTimeout(function(){if(!ended)start();},500);}else{fallback();}}
  };
  start();
}
function playGoogle(text,onEnd){
  /* 谷歌在线音色（translate_tts）：百度不可达时的第二级在线兜底；也失败则切系统语音 */
  if(text.length>180){speak(text,onEnd);return;}
  let ended=false;
  const doneOnce=()=>{if(ended)return;ended=true;if(onEnd)onEnd();};
  const fallback=()=>{if(ended)return;ended=true;toast("在线语音不可用，已改用系统音色");speak(text,onEnd);};
  try{
    const url="https://translate.googleapis.com/translate_tts?ie=UTF-8&q="+encodeURIComponent(text)+"&tl=en&client=tw-ob";
    const a=new Audio(url);
    a.referrerPolicy="no-referrer";
    a.preload="auto";
    a.playbackRate=S.speed;
    S.curAudio=a;
    a.onended=doneOnce;
    a.onerror=fallback;
    const pr=a.play();
    if(pr&&pr.catch)pr.catch(fallback);
  }catch(e){fallback();}
}


/* ========== 句子切分 ========== */
const ABBR=/\b(?:Mr|Mrs|Ms|Dr|Prof|St|Mt|Ave|Blvd|Rd|Ltd|Inc|Co|Corp|Jr|Sr|vs|etc|e\.g|i\.e|no|fig|approx|dept|est|min|max|hr|sec|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec|Mon|Tue|Tues|Wed|Thu|Thur|Thurs|Fri|Sat|Sun|U\.S|U\.K|U\.N|Ph\.D|M\.D)\.\s*$/i;
/* 逗号/分号/冒号前至少多少词才断句：调大 → 句子更长更完整；调小 → 句子更短更碎 */
const MIN_COMMA_WORDS=4;
function splitLong(s){
  const words=s.split(/\s+/);
  if(words.length<=33)return[s];
  const out=[];let cur=[];
  for(const w of words){
    cur.push(w);
    if(cur.length>28){
      let cut=cur.length;
      for(let k=cur.length-1;k>0;k--){
        if(/[,;:]$/.test(cur[k-1])){cut=k;break;}
        if(/^(and|but|or|so|then)$/i.test(cur[k])){cut=k+1;break;}
      }
      if(cut===cur.length)cut=Math.floor(cur.length*0.8);
      out.push(cur.slice(0,cut).join(" "));
      cur=cur.slice(cut);
    }
  }
  if(cur.length)out.push(cur.join(" "));
  return out;
}
function splitSentences(text){
  if(!text||!text.trim())return[];
  const t0=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines=t0.split("\n");
  const out=[];
  /* 第一遍：标记标题行 —— 无句末标点、≤8 词、大写开头、且后接大写开头的行。
     章节标题/目录行不会被切进正文句子 */
  const isTitle=new Array(lines.length).fill(false);
  for(let li=0;li<lines.length;li++){
    const line=lines[li].trim();
    if(!line)continue;
    const next=(lines[li+1]||"").trim();
    if(!/[.!?…]$/.test(line)&&line.split(/\s+/).length<=8&&/^[A-Z]/.test(line)
       &&next!==""&&/^[A-Z"'(]/.test(next))isTitle[li]=true;
  }
  /* 第二遍：顺序处理 —— 标题行独立成句；正文按空行分段落，
     段内跨行合并（书籍排版断行），段与段之间不粘连；
     只有遇到句末标点（. ! ? …）才真正断句 */
  const bodyBuf=[];
  const flushBody=()=>{
    if(!bodyBuf.length)return;
    const flat=bodyBuf.join(" ");
    /* 点缩写保护：U.S. / e.g. / Ph.D. 等 A.B. 模式换成哨兵，避免在中间点断句 */
    const t=flat.replace(/(\b[A-Za-z](?:\.[A-Za-z])+\.)/g,m=>"\u0001"+m.replace(/\./g,"\u0002")+"\u0001");
    const chars=t.split("");
    let buf="";
    for(let i=0;i<chars.length;i++){
      buf+=chars[i];
      const c=chars[i];
      /* 逗号/分号/冒号：按逗号断句，但需同时满足：
         ① 逗号前词数 >= MIN_COMMA_WORDS；
         ② 逗号后到下一个标点不止 1-3 个词（防止 "..., too." / "..., however," 这类短尾巴被单独裁掉） */
      if(c===","||c===";"||c===":"){
        const cnt=buf.replace(/[;,:\s]+$/,"").trim().split(/\s+/).filter(Boolean).length;
        let kk=i+1;
        while(kk<chars.length&&!/[.!,?;:\n…]/.test(chars[kk])){kk++;}
        const after=kk>i+1?chars.slice(i+1,kk).join("").trim().split(/\s+/).filter(Boolean).length:0;
        if(cnt>=MIN_COMMA_WORDS&&after>3){ out.push(buf.trim()); buf=""; }
        continue;
      }
      const isEnd=(c==="."||c==="!"||c==="?"||c==="…");
      if(!isEnd)continue;
      /* 小数保护：3.14 不切 */
      if(c==="."){
        const prev=buf[buf.length-2];
        const afterRest=chars.slice(i+1).join("").replace(/^\s+/,"");
        if(prev&&/\d/.test(prev)&&/^\d/.test(afterRest))continue;
      }
      /* 吃进句尾引号 / 右括号 */
      let j=i+1;
      while(j<chars.length&&/["')\]]/.test(chars[j])){buf+=chars[j];j++;}
      const rest=chars.slice(j).join("").replace(/^\s+/,"");
      const followedBySentence=(rest===""||/^[A-Z0-9"'(]/.test(rest));
      const isAbbr=ABBR.test(buf.replace(/["')\]]+$/,""));
      if(!isAbbr&&followedBySentence){ out.push(buf.trim()); buf=""; }
      i=j-1;
    }
    if(buf.trim())out.push(buf.trim());
    bodyBuf.length=0;
  };
  for(let li=0;li<lines.length;li++){
    const line=lines[li].trim();
    if(!line){flushBody();continue;}
    if(isTitle[li]){flushBody();out.push(line);continue;}
    bodyBuf.push(line);
  }
  flushBody();
  const cleaned=out.map(s=>s.replace(/\s+/g," ").trim().replace(/\u0001/g,"").replace(/\u0002/g,".")).filter(Boolean);
  const final=[];
  for(const s of cleaned)final.push(...splitLong(s));
  return final;
}

/* ========== 渲染 ========== */
function render(){
  const list=$("readList");list.innerHTML="";
  $("statInfo").textContent="共 "+S.sents.length+" 句 · 点句子朗读 · 点单词查释义";
  S.sents.forEach((s,i)=>{
    const card=document.createElement("div");
    card.className="sent";card.dataset.i=i;
    card.style.fontSize=varFs()+"px";
    card.innerHTML=`<span class="snum">${i+1}</span>`+wordSpans(s)+`<span class="side-btns"><span class="speak-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg></span><button class="tr-btn" data-i="${i}" title="翻译这句">译</button></span>`;
    card.addEventListener("click",ev=>{
      const w=ev.target.closest(".w");
      if(w){ev.stopPropagation();onWord(w.dataset.w,w,i);return;}
      const tb=ev.target.closest(".tr-btn");
      if(tb){ev.stopPropagation();toggleTranslate(+tb.dataset.i);return;}
      toggleSentence(i);
    });
    list.appendChild(card);
  });
  if(!S.sents.length){list.innerHTML=`<div class="empty">没有识别到句子。<br>请检查输入的是英文文本。</div>`;}
}
function localFallback(s){
  /* 在线翻译不可用时的兜底：内置词典逐词释义（离线可用、永远可靠） */
  const words=s.split(/\s+/).map(w=>w.replace(/[^a-zA-Z']/g,"")).filter(Boolean);
  const parts=[];const seen={};
  for(const raw of words){
    const w=stem(raw.toLowerCase());
    if(seen[w])continue;seen[w]=1;
    const d=DICT[w];
    if(d)parts.push(w+" "+d);
    if(parts.length>=8)break;
  }
  return parts.length?("（词义参考）"+parts.join(" · ")):"";
}
function toggleTranslate(i){
  const card=document.querySelector(`.sent[data-i="${i}"]`);
  if(!card)return;
  let box=card.querySelector(".tr-box");
  if(box){box.remove();return;}
  const s=S.sents[i];
  if(!s)return;
  box=document.createElement("div");
  box.className="tr-box";
  card.appendChild(box);
  if(S.trCache[s]!==undefined){box.textContent=S.trCache[s];return;}
  box.textContent="翻译中…";
  const show=(txt)=>{if(card.contains(box))box.textContent=txt;};
  /* 源1：MyMemory（国内可达，免费每日限量）；源2：谷歌（网络可达时使用） */
  const srcMymemory=()=>{
    fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(s)+"&langpair=en|zh-CN")
      .then(r=>{if(!r.ok)throw new Error("http "+r.status);return r.json();})
      .then(d=>{
        const t=d&&d.responseData&&d.responseData.translatedText;
        if(!t||/^QUOTA/i.test(t)||/MYMEMORY WARNING/i.test(t))throw new Error("quota");
        S.trCache[s]=t;show(t);
      })
      .catch(()=>srcGoogle(0));
  };
  const srcGoogle=(attempt)=>{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),8000);
    fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=en&tl=zh-CN&q="+encodeURIComponent(s),{signal:ctrl.signal})
      .then(r=>{clearTimeout(timer);if(!r.ok)throw new Error("http "+r.status);return r.json();})
      .then(d=>{
        const t=d&&d[0]&&d[0].map(x=>x[0]).join("");
        if(!t)throw new Error("no result");
        if(attempt<2&&/[.!?]$/.test(s)&&!/[。！？.!?]$/.test(t)){srcGoogle(attempt+1);return;}
        S.trCache[s]=t;show(t);
      })
      .catch(()=>{clearTimeout(timer);show(localFallback(s)||"翻译服务暂时不可用，请检查网络后重试");});
  };
  srcMymemory();
}
function wordSpans(s){
  /* 把单词包进 span，标点留在词上便于高亮，去空格 */
  return s.split(/(\s+)/).map(part=>{
    if(/^\s+$/.test(part))return part;
    if(!part)return "";
    return `<span class="w" data-w="${escapeHtml(part)}">${escapeHtml(part)}</span>`;
  }).join("");
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function varFs(){return FONTS[S.fsIdx];}
function setFs(){
  document.documentElement.style.setProperty("--fs",varFs()+"px");
  document.querySelectorAll(".sent").forEach(c=>c.style.fontSize=varFs()+"px");
  $("fontLbl").textContent=FONT_LBL[S.fsIdx];
}
</script>
<!-- ===== JS 第二部分：交互、朗读、词典 ===== -->
<script>
"use strict";
/* ========== 朗读与逐词高亮 ========== */
let hlTimer=null;
function clearHl(){ if(hlTimer){clearInterval(hlTimer);hlTimer=null;} }
function estimateTimes(text){
  const words=text.split(/\s+/);
  const lens=words.map(w=>Math.max(1,w.replace(/[^a-zA-Z']/g,"").length));
  const totalChars=lens.reduce((a,b)=>a+b,0);
  const wpm=165/S.speed;
  const totalMs=words.length*(60000/wpm)+words.length*25;
  const out=[];let t=0;
  for(let i=0;i<words.length;i++){
    out.push({w:words[i],t});
    t+=totalMs*(lens[i]+1)/(totalChars+words.length);
  }
  const scale=1.18;
  return out.map(o=>({w:o.w,t:o.t*scale}));
}
function splitChunks(text){
  const words=text.split(/\s+/);
  const chunks=[];let cur=[];let len=0;
  for(const w of words){
    cur.push(w);len++;
    const core=w.replace(/[)"']+$/,"");
    const hasPause=/,|;|:|—$/.test(core);
    if(len>=4||hasPause){chunks.push(cur);cur=[];len=0;}
  }
  if(cur.length)chunks.push(cur);
  return chunks;
}
function highlightAt(card,ci){
  const words=card.querySelectorAll(".w");
  let acc=0,hit=false;
  for(const w of words){
    w.classList.remove("hl");
    if(!hit){
      const len=w.dataset.w.length;
      if(ci>=acc&&ci<acc+len){w.classList.add("hl");hit=true;}
      acc+=len+1;
    }
  }
}
function playOne(i,onDone){
  stopAll();
  S.playing=i;
  const card=document.querySelector(`.sent[data-i="${i}"]`);
  if(!card){if(onDone)onDone();return;}
  card.classList.add("playing");
  const done=()=>{
    if(S.playing!==i)return;
    card.classList.remove("playing");
    card.querySelectorAll(".w.hl").forEach(w=>w.classList.remove("hl"));
    if(onDone)onDone();
  };
  /* 整句一次朗读：连贯自然；桌面 Chrome 可逐词高亮，iOS 整句高亮 */
  if(S.engine==="edge"){
    playBaidu(S.sents[i],done);
  }else{
    speak(S.sents[i],done,ci=>{if(S.playing===i)highlightAt(card,ci);});
  }
}
function toggleSentence(i){
  if(S.playing===i){stopAll();return;}
  if(S.playAll){S.playAll=false;$("btnPlayAll").classList.remove("on");}
  playOne(i,()=>stopAll());
}
function stopAll(){
  clearHl();
  S.edgeCancel=true;
  if(S.curAudio){try{S.curAudio.pause();}catch(e){}S.curAudio=null;}
  if(typeof speechSynthesis!=="undefined")speechSynthesis.cancel();
  document.querySelectorAll(".sent.playing").forEach(c=>c.classList.remove("playing"));
  document.querySelectorAll(".w.hl").forEach(w=>w.classList.remove("hl"));
  S.playing=-1;
}
function playAll(){
  S.playAll=!S.playAll;
  $("btnPlayAll").classList.toggle("on",S.playAll);
  if(S.playAll)playNext(0);
  else stopAll();
}
function playNext(i){
  if(!S.playAll||i>=S.sents.length){
    stopAll();S.playAll=false;$("btnPlayAll").classList.remove("on");return;
  }
  playOne(i,()=>{if(S.playAll&&S.playing===i)playNext(i+1);});
}

/* ========== 单词查询与抽屉 ========== */
let curAudio=null;
function stopWordAudio(){ if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;} }
async function onWord(w,el){
  w=w.replace(/[^\w'-]+/g,"");
  if(!w)return;
  stopWordAudio();
  document.querySelectorAll(".w.tapped").forEach(x=>x.classList.remove("tapped"));
  el.classList.add("tapped");
  S.curWord=w;
  openSheet(w);
}
function openSheet(w){
  stopAll();
  const inner=$("sheetInner");
  inner.innerHTML=`<div class="w-loading">正在查询 “${escapeHtml(w)}” …</div>`;
  showSheet();
  queryWord(w).then(res=>{
    if(S.curWord!==w)return;
    if(res.type==="youdao")renderYouDao(w,res.data);
    else if(res.type==="remote")renderRemote(w,res.data,res.offline);
    else if(res.type==="local")renderLocal(w,res.data,res.offline,res.lemma);
    else renderFail(w,res.offline);
  });
}
const IRREG={
  went:"go",gone:"go",been:"be",was:"be",were:"be",is:"be",are:"be",am:"be",
  had:"have",has:"have",did:"do",does:"do",said:"say",says:"say",saw:"see",seen:"see",
  made:"make",makes:"make",came:"come",comes:"come",took:"take",taken:"take",takes:"take",
  got:"get",gotten:"get",gets:"get",gave:"give",given:"give",gives:"give",found:"find",finds:"find",
  thought:"think",thinks:"think",knew:"know",known:"know",knows:"know",felt:"feel",feels:"feel",
  told:"tell",tells:"tell",spoke:"speak",spoken:"speak",speaks:"speak",wrote:"write",written:"write",writes:"write",

function lemmatize(w){
  w=w.toLowerCase().replace(/[^a-z']/g,"");
  if(IRREG[w])return IRREG[w];
  if(w.endsWith("'s"))return w.slice(0,-2);
  if(w.endsWith("ies")&&w.length>4)return w.slice(0,-3)+"y";
  if(w.endsWith("ied")&&w.length>4)return w.slice(0,-3)+"y";
  if(w.endsWith("es")){
    const b=w.slice(0,-2);
    if(/[sxz]|ch$|sh$|o$/.test(b))return b;
    return w.slice(0,-1);
  }
  if(w.endsWith("s")&&!w.endsWith("ss")&&w.length>3)return w.slice(0,-1);
  if(w.endsWith("ing")&&w.length>5){
    const b=w.slice(0,-3);
    if(DICT[b])return b;
    if(DICT[b+"e"])return b+"e";
    if(b.length>2&&b[b.length-1]===b[b.length-2])return b.slice(0,-1);
    return b;
  }
  if(w.endsWith("ed")&&w.length>4){
    const b=w.slice(0,-2);
    if(DICT[b])return b;
    if(DICT[b+"e"])return b+"e";
    if(b.length>2&&b[b.length-1]===b[b.length-2])return b.slice(0,-1);
    return b;
  }
  if(w.endsWith("er")&&w.length>4&&DICT[w.slice(0,-2)])return w.slice(0,-2);
  if(w.endsWith("est")&&w.length>4&&DICT[w.slice(0,-3)])return w.slice(0,-3);
  return w;
}
function youdaoJsonp(word,timeout){
  return new Promise((resolve)=>{
    const cb="__yd_"+Math.random().toString(36).slice(2);
    let done=false,s=null;
    const cleanup=()=>{try{delete window[cb];}catch(e){} if(s&&s.parentNode)s.parentNode.removeChild(s);};
    const timer=setTimeout(()=>{if(!done){done=true;cleanup();resolve(null);}},timeout);
    window[cb]=data=>{if(done)return;done=true;clearTimeout(timer);cleanup();resolve(data);};
    s=document.createElement("script");
    s.src="https://dict.youdao.com/suggest?num=2&ver=3.0&doctype=json&cache=false&le=en&q="+encodeURIComponent(word)+"&callback="+cb;
    s.onerror=()=>{if(!done){done=true;clearTimeout(timer);cleanup();resolve(null);}};
    document.head.appendChild(s);
  });
}
function dictApiQuery(word,timeout){
  return new Promise((resolve)=>{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),timeout);
    fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word),{signal:ctrl.signal,cache:"default"})
      .then(r=>r.ok?r.json():null)
      .then(d=>resolve(d&&d.length?d[0]:null))
      .catch(()=>resolve(null))
      .finally(()=>clearTimeout(timer));
  });
}
function parseYoudao(data,word){
  try{
    const es=data&&data.data&&data.data.entries;
    if(!es||!es.length)return null;
    const e=es[0];
    const explain=(e.explain||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
    return {word:e.entry||word, explain:explain.slice(0,220)};
  }catch(err){return null;}
}
async function queryWord(w){
  const key=lemmatize(w);
  const local=DICT[key];
  const [y,d]=await Promise.all([
    youdaoJsonp(w,2500).then(r=>parseYoudao(r,w)),
    dictApiQuery(w,3200)
  ]);
  if(y&&y.explain)return{type:"youdao",data:y,offline:false};
  if(d)return{type:"remote",data:d,offline:false};
  if(local)return{type:"local",data:local,offline:true,lemma:key!==w.toLowerCase()?w.toLowerCase():""};
  return{type:"fail",offline:true};
}

$("fileInput").addEventListener("change",ev=>{
  const f=ev.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const bytes=new Uint8Array(e.target.result);
      $("textInput").value=decodeText(bytes);
      toast("已读取："+f.name);
    }catch(err){ toast("读取失败，请确认是文本文件"); }
  };
  reader.readAsArrayBuffer(f);
  ev.target.value="";
});
function decodeText(bytes){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(bytes);}
  catch(e){
    try{return new TextDecoder("utf-16le").decode(bytes);}
    catch(e2){return new TextDecoder("utf-8").decode(bytes);}
  }
}

  try{
